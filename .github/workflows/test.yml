name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: tool/check_versions.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: ezoic_flutter_cmp_sdk
        working-directory: ezoic_flutter_cmp_sdk
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # Builds an app with the ads package alone, the CMP package alone, and both,
  # and runs both plugins' Kotlin unit tests. "ads, without CMP" is an ads app
  # with the README's Gradle exclude: it checks that the native CMP is not in
  # the APK, that the core is, and that an R8 release build still works.
  android:
    name: android (${{ matrix.case }}${{ matrix.without-cmp && ', without CMP' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [ads, cmp, both]
        without-cmp: [false]
        include:
          - { case: ads, without-cmp: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create app
        run: |
          tool/create_test_app.sh ${{ matrix.case }} "$RUNNER_TEMP/app" \
            ${{ matrix.without-cmp && '--without-cmp' || '' }}
      - name: Build APK
        working-directory: ${{ runner.temp }}/app
        run: flutter build apk --debug
      - name: Plugin unit tests
        working-directory: ${{ runner.temp }}/app/android
        run: |
          ./gradlew :ezoic_flutter_cmp_sdk:testDebugUnitTest
          if [ "${{ matrix.case }}" != cmp ]; then
            ./gradlew :ezoic_flutter_sdk:testDebugUnitTest
          fi
      - name: Check resolved native SDK
        working-directory: ${{ runner.temp }}/app/android
        run: |
          ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath > deps.txt
          grep -E 'com\.ezoic\.sdk:ezoic-(ads-sdk|cmp-sdk|consent-core)' deps.txt | sed 's/^[-+|\\ ]*//' | sort -u
          grep -q 'com.ezoic.sdk:ezoic-consent-core' deps.txt
          if [ "${{ matrix.without-cmp }}" = true ]; then
            if grep -q 'com.ezoic.sdk:ezoic-cmp-sdk' deps.txt; then exit 1; fi
          else
            grep -q 'com.ezoic.sdk:ezoic-cmp-sdk' deps.txt
          fi
          if [ "${{ matrix.case }}" = cmp ]; then
            if grep -q 'com.ezoic.sdk:ezoic-ads-sdk' deps.txt; then exit 1; fi
          fi
      # The debug APK isn't shrunk, so a missing class was never there.
      - name: Check the built-in CMP in the APK
        working-directory: ${{ runner.temp }}/app
        run: |
          dexdump=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/dexdump
          mkdir dex
          unzip -q build/app/outputs/flutter-apk/app-debug.apk 'classes*.dex' -d dex
          for dex in dex/*.dex; do "$dexdump" "$dex" | grep 'Class descriptor'; done > classes.txt
          wc -l < classes.txt
          grep -q "'Lcom/ezoic/ads/sdk/privacy/cmp/ConsentOutcome;'" classes.txt
          if [ "${{ matrix.without-cmp }}" = true ]; then
            if grep -q "'Lcom/ezoic/ads/sdk/privacy/cmp/EzoicCmp;'" classes.txt; then exit 1; fi
          else
            grep -q "'Lcom/ezoic/ads/sdk/privacy/cmp/EzoicCmp;'" classes.txt
          fi
      - name: R8 release build
        if: matrix.without-cmp
        working-directory: ${{ runner.temp }}/app
        run: flutter build apk --release

  ios:
    name: ios (${{ matrix.case }}, Flutter ${{ matrix.flutter }}, ${{ matrix.package-manager }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        case: [ads, cmp, both]
        flutter: [stable]
        package-manager: [spm, cocoapods]
        include:
          - { case: ads, flutter: 3.41.0, package-manager: spm }
          - { case: ads, flutter: 3.41.0, package-manager: cocoapods }
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
      - run: flutter --version
      - name: Create app
        run: tool/create_test_app.sh ${{ matrix.case }} "$RUNNER_TEMP/app" --${{ matrix.package-manager }}
      - name: Build for simulator
        working-directory: ${{ runner.temp }}/app
        run: flutter build ios --simulator --debug --no-codesign
      - name: Check resolved native SDK
        working-directory: ${{ runner.temp }}/app/ios
        run: |
          if [ "${{ matrix.package-manager }}" = spm ]; then
            test ! -e Pods
            test ! -e Podfile.lock
            python3 -c "
          import json
          pins = json.load(open('Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved'))['pins']
          dist = [p for p in pins if p['identity'] == 'ezoic-swift-sdk-dist']
          assert dist, 'ezoic-swift-sdk-dist not resolved'
          for p in pins: print(p['identity'], p['state'].get('version'))
          "
          else
            grep -E '^  - (ezoic_flutter_sdk|ezoic_flutter_cmp_sdk|PrebidMobile|Google-Mobile-Ads-SDK|AmazonPublisherServicesSDK) \(' Podfile.lock || true
            grep -qE '^  - ezoic_flutter_cmp_sdk \(' Podfile.lock
            # The vendored frameworks replace the frozen trunk pod.
            if grep -qE '^  - EzoicAdsSDK \(' Podfile.lock; then exit 1; fi
            # One copy of the CMP and consent-core frameworks, from ezoic_flutter_cmp_sdk.
            test "$(grep -o '"EzoicCmpSDKBinary"' 'Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig' | wc -l)" -eq 1
            test "$(grep -o '"EzoicConsentCoreBinary"' 'Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig' | wc -l)" -eq 1
          fi
      # The ads binary finds the CMP at runtime by class name, so a static link
      # without a reference to the provider leaves the CMP out silently
      # (EzoicAds.isBuiltInCmpIncluded false). The CMP stays in every iOS app.
      - name: Check the built-in CMP is linked
        working-directory: ${{ runner.temp }}/app/build/ios/iphonesimulator/Runner.app
        run: |
          found=false
          for binary in Runner *.dylib Frameworks/*.framework/*; do
            [ -f "$binary" ] || continue
            if nm "$binary" 2>/dev/null | grep -qF '_OBJC_CLASS_$_EZBuiltInCmpProvider'; then
              echo "EZBuiltInCmpProvider is linked into $binary"
              found=true
            fi
          done
          $found
