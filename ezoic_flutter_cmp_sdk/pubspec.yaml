name: ezoic_flutter_cmp_sdk
description: Ezoic CMP for Flutter (IAB TCF consent in GDPR regions, notice and "Do Not Sell" choice in covered US states) for Ezoic publishers whose app doesn't use Ezoic ads.
version: 1.25.0
homepage: https://github.com/ezoic/flutter-sdk/tree/master/ezoic_flutter_cmp_sdk
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ezoic.ezoic_flutter_cmp_sdk
        pluginClass: EzoicFlutterCmpSdkPlugin
      ios:
        pluginClass: EzoicFlutterCmpSdkPlugin

# Native iOS CMP for CocoaPods builds: ios/ezoic_flutter_cmp_sdk.podspec
# downloads EzoicConsentCore-<version>-cocoapods.xcframework.zip and
# EzoicCmpSDK-<version>-cocoapods.xcframework.zip from the ezoic-swift-sdk-dist
# GitHub release and checks each against its sha256. ezoic_flutter_sdk's pod
# uses this pod's copy of the consent core. Set by tool/pin_ios_sdk.sh; Swift
# Package Manager builds don't use it.
ezoic:
  ios_sdk:
    version: 1.25.0
    sha256:
      EzoicConsentCore: 1413c47723daad0638e869ba0e3d84221eab875ab26f8b3cd959924e7bcd44ff
      EzoicCmpSDK: 70a1bf5934a468442a7a9eb92457147225dd2e3c7b1f0806351fb828a0a56200
