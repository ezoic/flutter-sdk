name: ezoic_flutter_sdk
description: Ezoic Ads SDK for Flutter (Prebid + Google Ad Manager banner, native, interstitial and rewarded ads).
version: 1.21.0
homepage: https://github.com/ezoic/flutter-sdk
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # The built-in CMP's Dart types and native CMP plugin. Its iOS pod is the
  # only one that vendors EzoicCmpSDKBinary, so an app gets one copy of it.
  ezoic_flutter_cmp_sdk:
    path: ezoic_flutter_cmp_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ezoic.ezoic_flutter_sdk
        pluginClass: EzoicFlutterSdkPlugin
      ios:
        pluginClass: EzoicFlutterSdkPlugin
